<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0E1116">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Dark, big numbers, one colour per meaning: green = done or go, amber = caution, red = low or sore, blue = active. */
:root {
  --page: #0E1116; --tile: #181C24; --tile-2: #232936; --line: #2A3140;
  --ink: #F2F4F8; --ink-2: #9AA3B2; --ink-3: #5F6878;
  --red: #FF6B5E; --on-red: #1A0B09; --red-soft: #3A1D1B; --on-red-soft: #FFC9C3; --red-mid: #B8554C;
  --blue: #6FA8FF; --on-blue: #08111F; --blue-soft: #1B2B47; --on-blue-soft: #CFE0FF;
  --green: #3DDC84; --teal: #3DDC84; --on-teal: #06130B; --teal-soft: #173D2A; --on-teal-soft: #BFF3D5;
  --amber: #F5B83D; --amber-soft: #3D2F10; --on-amber-soft: #FFE2A8;
  --focus: #6FA8FF; --font: "Plus Jakarta Sans", ui-sans-serif, -apple-system, system-ui, sans-serif;
  --r-tile: 18px; --r-ctl: 14px; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.topbar { display: flex; align-items: center; gap: 6px; min-height: 48px; }
.ttl { flex: 1; min-width: 0; }
.ttl h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.ttl p { margin: 0; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.navbtn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--tile); display: grid; place-items: center; }
.sync { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.sheet .wrap { padding-block: 14px calc(112px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--tile); border-radius: var(--r-tile); padding: 14px 16px; min-width: 0; display: grid; gap: 4px; align-content: start; }
.wide { grid-column: 1 / -1; }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.mid { font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
.small { font-size: 13px; color: var(--ink-2); }
.stat { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.stat small { font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.now { box-shadow: 0 12px 28px -18px rgba(20, 33, 61, .45); padding: 16px 18px 18px; gap: 6px; }
.now .lbl { color: var(--red); font-weight: 700; }
.now .title { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.12; }
.foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 6px; }
.setbar { display: flex; gap: 4px; margin-top: 8px; }
.setbar i { flex: 1; height: 6px; border-radius: 3px; background: var(--tile-2); }
.setbar i.on { background: var(--red); } .setbar i.cur { background: var(--red-mid); }
.donebtn { border: 0; border-radius: 12px; height: 42px; padding: 0 16px; font-weight: 700; font-size: 14px; background: var(--red); color: var(--on-red); flex: none; }
.next { background: var(--blue); color: var(--on-blue); }
.next .lbl, .next .small { color: color-mix(in srgb, var(--on-blue) 80%, transparent); }
.ok { background: var(--teal); color: var(--on-teal); }
.ok .lbl, .ok .small { color: color-mix(in srgb, var(--on-teal) 80%, transparent); }
.rows > * + * { border-top: 1px solid var(--line); }
.ex { padding: 10px 0; display: grid; gap: 6px; }
.exh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.exh b { font-weight: 700; }
.sets { display: flex; flex-wrap: wrap; gap: 6px; }
.set { border: 0; border-radius: 10px; min-height: 36px; padding: 0 10px; background: var(--tile-2); font-weight: 600; font-size: 13px; color: var(--ink-2); }
.set[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }
.tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--tile-2); color: var(--ink-2); }
.tag.ai { color: var(--on-blue-soft); background: var(--blue-soft); }
.tag.done { color: var(--on-teal-soft); background: var(--teal-soft); }
.shead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--ink); color: var(--page); font-weight: 700; font-size: 13px; white-space: nowrap; }
.mini.ghost { background: var(--tile-2); color: var(--ink); }
.link { background: none; border: 0; color: var(--focus); font-weight: 700; font-size: 14px; padding: 6px 0; text-align: left; }
.empty { color: var(--ink-2); font-size: 14px; margin: 0; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 6px; max-width: 240px; }
.heat span { aspect-ratio: 1; border-radius: 4px; background: var(--tile-2); }
.heat .d { aspect-ratio: auto; background: none; font-size: 10px; color: var(--ink-3); text-align: center; font-weight: 600; }
.heat .l1 { background: #B5D4F4; } .heat .l2 { background: #85B7EB; } .heat .l3 { background: #378ADD; } .heat .l4 { background: #185FA5; }
.heat .today { box-shadow: inset 0 0 0 2px var(--red); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
select.field { appearance: none; -webkit-appearance: none; }
.field { min-height: 44px; border-radius: var(--r-ctl); border: 1.5px solid transparent; background: var(--tile-2); padding: 0 12px; font-size: 16px; width: 100%; min-width: 0; }
.field:focus { border-color: var(--focus); outline: none; }
textarea.field { padding: 10px 12px; min-height: 140px; resize: vertical; line-height: 1.5; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 46px; padding: 0 18px; border-radius: var(--r-ctl); border: 0; background: var(--tile-2); font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--page); }
.btn.danger { color: var(--red); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--tile-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; min-height: 38px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.hint { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.urlbox { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--tile-2); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all; }
.chg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 0; }
.chg .sub { font-size: 12.5px; color: var(--ink-2); }
.chg.undone .name { color: var(--ink-3); text-decoration: line-through; }
.chg .act { grid-row: 1 / 3; grid-column: 2; }
.tabbar { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; pointer-events: none; padding: 0 14px; }
.tabbar .in { pointer-events: auto; max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; height: 64px; padding: 0 6px;
  border-radius: 24px; background: var(--tile); box-shadow: 0 10px 30px -12px rgba(20, 33, 61, .35), 0 0 0 1px var(--line); }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 8px 0; font-size: 10.5px; font-weight: 600; color: var(--ink-3); position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after { content: ""; position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--red); }
.fab { justify-self: center; width: 48px; height: 48px; border-radius: 16px; border: 0; background: var(--red); color: var(--on-red); display: grid; place-items: center; }
.fab svg { width: 24px; height: 24px; }
.backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(14, 12, 30, .5); display: grid; align-items: end; }
.modal { background: var(--page); border-radius: 28px 28px 0 0; width: 100%; max-width: 560px; margin: 0 auto; max-height: 92%; overflow-y: auto; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; animation: up .35s cubic-bezier(.32,.72,0,1); }
@keyframes up { from { transform: translateY(100%); } }
@media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
.modal h3 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.ftile { background: var(--tile); border-radius: 18px; padding: 12px 14px; display: grid; gap: 8px; }
.ftile > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { color: var(--red); font-size: 13px; min-height: 1em; }
.auth { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--page) 92%, transparent); padding: 16px; }
.auth-card { width: 100%; max-width: 380px; background: var(--tile); border-radius: 26px; padding: 26px 22px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.auth-card h2 { margin: 4px 0 0; font-size: 24px; font-weight: 800; }
.auth-card p { margin: 0; color: var(--ink-2); font-size: 14px; }
.auth-card .field, .auth-card .btn { width: 100%; }
.tap { border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--tile); border-radius: var(--r-tile); padding: 10px 8px 12px; }
.wd { border: 0; background: none; display: grid; justify-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--ink-3); padding: 0; }
.wd i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 800; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-3); }
.wd.done i { background: var(--ink); color: var(--page); box-shadow: none; }
.wd.plan i { background: var(--blue-soft); color: var(--on-blue-soft); box-shadow: none; }
.wd.today { color: var(--red); }
.wd.today i { box-shadow: 0 0 0 2.5px var(--red); }
.wd svg { width: 14px; height: 14px; }
.ready { gap: 2px; }
.ready b { font-size: 17px; font-weight: 800; }
.ready span { font-size: 13px; }
.ready.ok { background: var(--teal-soft); color: var(--on-teal-soft); }
.ready.easy { background: var(--amber-soft); color: var(--on-amber-soft); }
.ready.rest { background: var(--red-soft); color: var(--on-red-soft); }
.dailyrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.dailyrow label { font-size: 12px; font-weight: 600; color: var(--ink-2); display: grid; gap: 3px; min-width: 0; }
.dailyrow .mini { min-height: 44px; }
.nowrow { display: flex; gap: 14px; align-items: center; }
.nowrow .title { font-size: 22px; }
.nowrow > div { min-width: 0; display: grid; gap: 2px; }
.ring { flex: none; }
.nowbtns { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.nowbtns .donebtn { flex: 1; height: 46px; }
.cl { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 3px 0; }
.cl span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl span:last-child { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.cl.done span:first-child { color: var(--ink-3); text-decoration: line-through; }
.cl.done span:last-child { color: var(--teal); }
.cl.cur { font-weight: 800; }
.cl.cur span:last-child { color: var(--red); font-weight: 800; }
.clh { font-size: 12px; font-weight: 700; color: var(--blue); margin-top: 6px; }
.clh:first-of-type { margin-top: 0; }
.srows { display: grid; gap: 6px; }
.srow { display: grid; grid-template-columns: 16px 1fr 1fr 40px; gap: 6px; align-items: center; }
.srow .sn { font-size: 12px; color: var(--ink-3); font-weight: 700; }
.sin { position: relative; display: block; }
.sin input { width: 100%; min-width: 0; min-height: 40px; border-radius: 10px; border: 1.5px solid transparent; background: var(--tile-2); padding: 0 36px 0 10px; font-size: 16px; font-weight: 700; }
.sin input:focus { border-color: var(--focus); outline: none; }
.sin i { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 11px; color: var(--ink-3); font-weight: 600; pointer-events: none; }
.srow.done .sin input { background: var(--teal-soft); color: var(--on-teal-soft); }
.scheck { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--tile-2); color: var(--ink-3); display: grid; place-items: center; padding: 0; }
.scheck[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }
.scheck svg { width: 18px; height: 18px; }
.nexthint { font-size: 13px; font-weight: 700; padding: 7px 10px; border-radius: 10px; background: var(--teal-soft); color: var(--on-teal-soft); }
.nexthint.stay { background: var(--tile-2); color: var(--ink-2); }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 9px; }
.chip.ok { background: var(--teal-soft); color: var(--on-teal-soft); }
.chip.soon { background: var(--amber-soft); color: var(--on-amber-soft); }
.chip.no { background: var(--red-soft); color: var(--on-red-soft); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 70px; margin-top: 6px; }
.bars i { display: block; border-radius: 5px 5px 2px 2px; background: var(--blue); min-height: 3px; }
.bars i.zero { background: var(--tile-2); }
.barl { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 10px; text-align: center; color: var(--ink-3); font-weight: 600; margin-top: 3px; }
.alert { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 70; max-width: 520px; margin: 0 auto; background: var(--red); color: var(--on-red); border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); animation: drop .3s ease-out; }
.alert b { font-size: 17px; display: block; } .alert span { font-size: 13px; opacity: .9; }
.alert button { margin-left: auto; border: 0; background: rgba(255,255,255,.2); color: inherit; border-radius: 10px; min-height: 36px; padding: 0 12px; font-weight: 700; }
@keyframes drop { from { transform: translateY(-120%); } }
.run { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px; margin-top: 4px; }
.run div small { display: block; font-size: 11px; color: var(--ink-2); font-weight: 600; }
.run div b { font-size: 16px; font-weight: 800; }
.zbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--tile-2); margin-top: 6px; }
.zbar i { display: block; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; }

/* ===== v3 components ===== */
.ttl h1 { font-size: 30px; }
.donebtn, .go { background: var(--green); color: #06130B; }
.go { border: 0; border-radius: 14px; height: 48px; padding: 0 22px; font-weight: 800; font-size: 15px; flex: none; }
.fab { background: var(--blue); color: #08111F; }
.tab[aria-current="page"]::after { background: var(--blue); }
.tabbar .in { background: #151922; box-shadow: 0 0 0 1px var(--line), 0 12px 30px -10px #000; }
.alert { background: var(--blue); color: #08111F; }
.alert button { background: rgba(8, 17, 31, .14); }
.toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); color: #0E1116; }
.wd.done i { background: var(--green); color: #06130B; }
.wd.today { color: var(--ink); }
.wd.today i { box-shadow: 0 0 0 2.5px var(--blue); }
.heat .l1 { background: #1F4D36; } .heat .l2 { background: #2A7A52; } .heat .l3 { background: #33AB6B; } .heat .l4 { background: #3DDC84; }
.heat .today { box-shadow: inset 0 0 0 2px var(--blue); }
.hero { justify-items: center; text-align: center; padding: 18px 16px 16px; gap: 3px; }
.dialbtn { background: none; display: grid; justify-items: center; gap: 3px; padding: 0; }
.hero b { font-size: 19px; font-weight: 800; }
.hero .dailyrow { width: 100%; text-align: left; margin-top: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat3 { padding: 12px 12px 14px; gap: 2px; }
.num { font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.num small { font-size: 14px; color: var(--ink-2); font-weight: 600; letter-spacing: 0; }
.meter { height: 4px; border-radius: 2px; background: var(--tile-2); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; border-radius: 2px; }
.pcard { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.pcard > div { display: grid; gap: 2px; min-width: 0; }
.wstats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0 4px 2px; }
.wstats small { display: block; font-size: 11px; color: var(--ink-2); font-weight: 600; }
.wstats b { font-size: 18px; font-weight: 800; }
.xname { font-weight: 800; font-size: 15px; color: var(--blue); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.xname span { color: var(--ink-2); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.tbl { display: grid; gap: 3px; }
.trow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 62px 54px 36px; gap: 6px; align-items: center; padding: 3px 5px; border-radius: 10px; }
.thead { font-size: 11px; font-weight: 700; color: var(--ink-3); padding-top: 0; padding-bottom: 0; }
.thead span:nth-child(n+3) { text-align: center; }
.trow .sn { font-weight: 800; font-size: 13px; text-align: center; }
.trow .prev { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow input { width: 100%; min-width: 0; height: 36px; border-radius: 9px; border: 1.5px solid transparent; background: var(--tile-2); text-align: center; font-size: 16px; font-weight: 700; padding: 0; }
.trow input:focus { border-color: var(--blue); outline: none; }
.trow.done { background: var(--teal-soft); }
.trow.done input { background: transparent; }
.tcheck { width: 36px; height: 36px; border-radius: 9px; border: 0; background: var(--tile-2); color: var(--ink-3); display: grid; place-items: center; padding: 0; }
.tcheck svg { width: 17px; height: 17px; }
.tcheck[aria-pressed="true"] { background: var(--green); color: #06130B; }
.restbar { position: fixed; left: 14px; right: 14px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 25; max-width: 420px; margin: 0 auto; background: var(--blue); color: #08111F; border-radius: 16px; padding: 8px 8px 8px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 24px -10px #000; }
.restbar b { font-size: 17px; font-weight: 800; }
.restbar button { border: 0; background: rgba(8, 17, 31, .14); color: inherit; font-weight: 800; border-radius: 10px; min-height: 38px; padding: 0 12px; margin-left: 4px; }
.resting .sheet .wrap { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
.feed { gap: 8px; }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fhead b { font-size: 16px; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.f3 small { display: block; font-size: 11px; color: var(--ink-2); font-weight: 600; }

.wbars i { display: block; border-radius: 4px; background: var(--green); min-height: 4px; }
.wbars i.zero { background: var(--tile-2); }

</head>
<body>
<header class="top"><div class="wrap"><div class="topbar">

  <span class="sync" id="syncPill"></span>

<nav class="tabbar" aria-label="Sections"><div class="in">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="9" rx="2"/><rect x="13" y="4" width="7" height="5" rx="2"/><rect x="13" y="11" width="7" height="9" rx="2"/><rect x="4" y="15" width="7" height="5" rx="2"/></svg>Home</button>
  <button class="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h3M10 6h10M4 12h3M10 12h10M4 18h3M10 18h10"/></svg>Workout</button>
  <button class="fab" data-act="add" aria-label="Add workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Activity</button>
  <button class="tab" data-tab="claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 5.5h15v10h-8l-4.5 3.5v-3.5h-2.5z"/><path d="M8.5 10.5h7"/></svg>Claude</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="authRoot"></div>
<div id="toastRoot"></div>
<div id="restRoot"></div>
<div id="alertRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ---------- state ---------- */
const S = { tab: "today", day: todayISO(), mode: "loading", sessions: [], changes: [], daily: [], hold: null, editDaily: false, profile: null, connector: false, newUrl: null, sheet: null, restEnd: 0, prEx: null, actView: "feed", stale: false };
let sb = null, uid = null, api = null;
const REST_SEC = 90;
const KINDS = ["strength", "cardio", "stretch"];
const MUSCLES = ["chest", "back", "shoulders", "arms", "core", "legs"];

/* ---------- helpers ---------- */
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayISO() { return iso(new Date()); }
function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
function dayLabel(s, o = { weekday: "long", month: "short", day: "numeric" }) { return parseISO(s).toLocaleDateString("en-US", o); }
function relDay(s) { const t = todayISO(); return s === t ? "Today" : s === addDays(t, 1) ? "Tomorrow" : s === addDays(t, -1) ? "Yesterday" : dayLabel(s, { weekday: "short", month: "short", day: "numeric" }); }
function weekStart(s) { const d = parseISO(s); return addDays(s, -((d.getDay() + 6) % 7)); }   // Monday
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ago(ts) { const s = (Date.now() - new Date(ts)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago" : s < 86400 ? Math.floor(s / 3600) + " h ago" : new Date(ts).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function toast(m) { const r = document.getElementById("toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2600); }
function prof() { return S.profile || { goal: "general fitness", targets: { strength: 4, cardio: 2, stretch: 3 }, notes: "", timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }; }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function fmtNum(n) { return Math.round(n).toLocaleString("en-US"); }
function fmtClock(min) { const t = Math.round(min * 60), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0"); }
function parseClock(v) { v = String(v ?? "").trim(); if (!v) return null; if (v.includes(":")) { const p = v.split(":").map(Number); if (p.some(isNaN)) return null; return p.length === 3 ? p[0] * 60 + p[1] + p[2] / 60 : p[0] + p[1] / 60; } const n = parseFloat(v); return isNaN(n) ? null : n; }
const ZONE_COLORS = ["#85B7EB", "#378ADD", "#EF9F27", "#E24B4A", "#791F1F"];

// Sound and alert banner for "rest's over". iPhones only play sound after a tap, so the first tap unlocks audio.
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch {} }
function beep() {
  try { unlockAudio(); const t = actx.currentTime;
    for (const [at, f] of [[0, 880], [0.28, 880], [0.56, 1175]]) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t + at); g.gain.exponentialRampToValueAtTime(0.35, t + at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + at + 0.22); o.start(t + at); o.stop(t + at + 0.24); }
  } catch {}
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
}
function showAlert(title, msg) {
  const r = document.getElementById("alertRoot");
  r.innerHTML = `<div class="alert" role="alert"><div><b>${esc(title)}</b><span>${esc(msg || "")}</span></div><button data-act="closealert">OK</button></div>`;
  clearTimeout(showAlert.t); showAlert.t = setTimeout(() => r.innerHTML = "", 12000);
}

// Guess the muscle group from an exercise name. Order matters ("leg press" before "press").
const MUSCLE_WORDS = [
  ["legs", /squat|lunge|leg |leg$|legs|rdl|romanian|calf|hip thrust|glute|step.?up|hamstring|quad/i],
  ["back", /deadlift|row|pull|lat |lats|chin|back/i],
  ["chest", /bench|chest|push.?up|fly|flye|dip/i],
  ["arms", /curl|tricep|bicep|pushdown|skull|extension|hammer/i],
  ["shoulders", /overhead|ohp|shoulder|lateral|military|arnold|face pull|press/i],
  ["core", /plank|crunch|\bab|abs|core|sit.?up|hollow|russian/i],
];
function guessMuscle(name) { for (const [m, re] of MUSCLE_WORDS) if (re.test(name)) return m; return null; }
function guessType(name) { return /run|jog|bike|cycl|row(ing)? machine|swim|walk|elliptical|stair|hiit|jump rope|cardio/i.test(name) ? "cardio" : /stretch|yoga|mobility|foam|pose|hold/i.test(name) ? "stretch" : "strength"; }

// One line per exercise: "Bench press: 4x8 @135", "Run: 20 min", "Hip stretch: 10 min".
function parseLines(text, old = []) {
  return text.split("\n").map(l => l.trim()).filter(Boolean).map((line, i) => {
    const [rawName, rest = ""] = line.includes(":") ? [line.slice(0, line.indexOf(":")), line.slice(line.indexOf(":") + 1)] : [line, ""];
    const name = rawName.trim().slice(0, 80) || "Exercise";
    const prev = old.find(e => e.name.toLowerCase() === name.toLowerCase()) || old[i];
    const type = guessType(name), muscle = type === "strength" ? guessMuscle(name) : null;
    const minM = /(\d+)\s*min/i.exec(rest);
    const setM = /(\d+)\s*[x×]\s*(\d+)/i.exec(rest);
    const wM = /@\s*(\d+(?:\.\d+)?)/.exec(rest) || /(\d+(?:\.\d+)?)\s*kg/i.exec(rest);
    if (setM) {
      const n = Math.min(12, +setM[1]), r = +setM[2], w = wM ? +wM[1] : null;
      const same = prev?.name?.toLowerCase() === name.toLowerCase() && prev.sets?.length === n && (prev.sets[0].t ?? prev.sets[0].r) === r && (prev.sets[0].w ?? null) === w;
      const sets = same ? prev.sets : Array.from({ length: n }, (_, k) => ({ w, r, done: !!prev?.sets?.[k]?.done }));
      return { name, muscle, type: "strength", sets, min: null, done: sets.every(s => s.done) };
    }
    return { name, muscle, type: type === "strength" && minM ? "cardio" : type, sets: [], min: minM ? +minM[1] : null, done: !!prev?.done, ...(prev?.stats ? { stats: prev.stats } : {}) };
  });
}
function toLines(ex) {
  return ex.map(e => e.sets?.length ? `${e.name}: ${e.sets.length}x${e.sets[0].t ?? e.sets[0].r}${e.sets[0].w ? " @" + e.sets[0].w : ""}` : `${e.name}${e.min ? ": " + e.min + " min" : ""}`).join("\n");
}
function exDone(e) { return e.sets?.length ? e.sets.every(s => s.done) : !!e.done; }
function sessionsOn(d) { return S.sessions.filter(s => s.day === d); }
function doneSessions() { return S.sessions.filter(s => s.status === "done"); }
function volume(s) { return s.exercises.reduce((a, e) => a + (e.sets || []).filter(x => x.done && x.w).reduce((b, x) => b + x.w * x.r, 0), 0); }
function hasActivity(s) { return s.status === "done" || s.exercises.some(e => exDone(e) || (e.sets || []).some(x => x.done)); }

/* ---------- training math ---------- */
function streak() {
  const days = new Set(S.sessions.filter(hasActivity).map(s => s.day));
  let d = todayISO(); if (!days.has(d)) d = addDays(d, -1);
  let n = 0; while (days.has(d)) { n++; d = addDays(d, -1); } return n;
}
function weekCounts(start = weekStart(todayISO())) {
  const c = { strength: 0, cardio: 0, stretch: 0 };
  for (const s of S.sessions) if (s.status === "done" && s.day >= start && s.day <= addDays(start, 6)) c[s.kind]++;
  return c;
}
// Days since each muscle group was last trained (null = not in the last few months).
function recovery() {
  const t = todayISO(), r = {};
  for (const m of MUSCLES) r[m] = null;
  for (const s of S.sessions) if (s.day <= t && hasActivity(s)) for (const e of s.exercises) {
    if (!e.muscle || !(exDone(e) || (e.sets || []).some(x => x.done))) continue;
    const d = daysBetween(s.day, t); if (r[e.muscle] === null || d < r[e.muscle]) r[e.muscle] = d;
  }
  return r;
}
function recColor(d) { return d === null || d >= 3 ? "var(--teal)" : d >= 2 ? "#85B7EB" : d >= 1 ? "var(--red-mid)" : "var(--red)"; }
function recWord(d) { return d === null || d >= 3 ? "ready" : d >= 2 ? "almost ready" : "recovering"; }
// Heaviest weight per day for one exercise.
function history(name) {
  const out = [];
  for (const s of [...S.sessions].sort((a, b) => a.day.localeCompare(b.day))) for (const e of s.exercises) {
    if (e.name.toLowerCase() !== name.toLowerCase()) continue;
    const w = Math.max(0, ...(e.sets || []).filter(x => x.done && x.w).map(x => x.w));
    if (w) out.push({ day: s.day, w });
  }
  return out;
}
function liftNames() { const m = new Map(); for (const s of S.sessions) for (const e of s.exercises) if (e.sets?.some(x => x.done && x.w)) m.set(e.name.toLowerCase(), e.name); return [...m.values()]; }
function recordsThisWeek() {
  const ws = weekStart(todayISO()); let n = 0;
  for (const name of liftNames()) { const h = history(name), before = Math.max(0, ...h.filter(x => x.day < ws).map(x => x.w)), now = Math.max(0, ...h.filter(x => x.day >= ws).map(x => x.w)); if (before && now > before) n++; }
  return n;
}

/* ---------- data: Supabase (live) or sample (preview) ---------- */
const COLS = "id,day,title,kind,status,exercises,notes,source,created_at,updated_at";
function pick(s) { return { day: s.day, title: s.title, kind: s.kind, status: s.status, exercises: s.exercises, notes: s.notes || "" }; }
function upsertLocal(s) { const i = S.sessions.findIndex(x => x.id === s.id); if (i >= 0) S.sessions[i] = s; else S.sessions.push(s); }
function randomToken() { const b = crypto.getRandomValues(new Uint8Array(24)); return btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
async function sha256(s) { const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join(""); }

function liveApi() {
  return {
    async load() {
      const [ses, pr, chg, con, dly] = await Promise.all([
        sb.from("wk_sessions").select(COLS).gte("day", addDays(todayISO(), -120)).order("day"),
        sb.from("wk_profile").select("*").maybeSingle(),
        sb.from("wk_changes").select("*").order("created_at", { ascending: false }).limit(40),
        sb.from("wk_connector").select("created_at").maybeSingle(),
        sb.from("wk_daily").select("day,rhr,hrv").gte("day", addDays(todayISO(), -30)).order("day"),
      ]);
      for (const r of [ses, pr, chg, con]) if (r.error) throw r.error;
      S.sessions = ses.data; S.changes = chg.data; S.connector = !!con.data; S.daily = dly.error ? [] : dly.data;
      if (pr.data) S.profile = pr.data; else await this.saveProfile(prof());
    },
    async saveDaily(d) {
      const { data, error } = await sb.from("wk_daily").upsert({ user_id: uid, day: d.day, rhr: d.rhr, hrv: d.hrv }).select("day,rhr,hrv").single(); if (error) throw error;
      S.daily = S.daily.filter(x => x.day !== data.day).concat(data);
    },
    async saveSession(s) {
      const q = s.id ? sb.from("wk_sessions").update(pick(s)).eq("id", s.id) : sb.from("wk_sessions").insert(pick(s));
      const { data, error } = await q.select(COLS).single(); if (error) throw error; upsertLocal(data); return data;
    },
    async deleteSession(id) { const { error } = await sb.from("wk_sessions").delete().eq("id", id); if (error) throw error; S.sessions = S.sessions.filter(s => s.id !== id); },
    async saveProfile(p) {
      const { data, error } = await sb.from("wk_profile").upsert({ goal: p.goal, targets: p.targets, notes: p.notes, timezone: p.timezone, rhr_base: p.rhr_base ?? null, hrv_base: p.hrv_base ?? null }).select("*").single();
      if (error) throw error; S.profile = data;
    },
    async undo(c) {
      if (c.action === "add") { const { error } = await sb.from("wk_sessions").delete().eq("id", c.session_id); if (error) throw error; }
      else if (c.action === "update") { const { error } = await sb.from("wk_sessions").update(pick(c.before)).eq("id", c.session_id); if (error) throw error; }
      else { const { error } = await sb.from("wk_sessions").upsert({ id: c.session_id, ...pick(c.before), source: c.before.source || "claude" }); if (error) throw error; }
      const { error } = await sb.from("wk_changes").update({ undone: true }).eq("id", c.id); if (error) throw error;
      await this.load();
    },
    async makeConnector() {
      const token = randomToken(); const { error } = await sb.from("wk_connector").upsert({ token_hash: await sha256(token) }); if (error) throw error;
      S.connector = true; return `${window.WK_CONFIG.supabaseUrl}/functions/v1/workout-mcp/${token}`;
    },
    async dropConnector() { const { error } = await sb.from("wk_connector").delete().eq("user_id", uid); if (error) throw error; S.connector = false; },
  };
}

function previewApi() {
  const t = todayISO(), id = () => "p" + Math.random().toString(36).slice(2, 9);
  const L = (lines, done) => parseLines(lines).map(e => done ? { ...e, done: true, sets: e.sets.map(s => ({ ...s, done: true })) } : e);
  const mk = (off, title, kind, lines, done = true, src = "app") => ({ id: id(), day: addDays(t, off), title, kind, status: done ? "done" : "planned", exercises: L(lines, done), notes: "", source: src, created_at: new Date().toISOString() });
  const push = (w) => `Bench press: 4x8 @${w}\nDumbbell shoulder press: 3x10 @20\nTricep pushdown: 3x12 @22.5`;
  const pull = `Cable row: 4x10 @40\nLat pulldown: 3x12 @38\nBicep curl: 3x12 @12`;
  const legs = `Squat: 4x10 @40\nRomanian deadlift: 3x10 @30\nWalking lunges: 3x10`;
  S.sessions = [
    mk(-30, "Push day", "strength", push(52.5)), mk(-27, "Legs", "strength", legs), mk(-25, "Pull day", "strength", pull), mk(-23, "Easy run", "cardio", "Run: 25 min"),
    mk(-21, "Push day", "strength", push(55)), mk(-19, "Full-body stretch", "stretch", "Hip stretch: 10 min\nHamstring stretch: 5 min"), mk(-18, "Pull day", "strength", pull),
    mk(-16, "Legs", "strength", legs), mk(-14, "Push day", "strength", push(57.5)), mk(-13, "Bike", "cardio", "Bike: 30 min"), mk(-11, "Pull day", "strength", pull),
    mk(-9, "Push day", "strength", push(60)), mk(-8, "Stretch", "stretch", "Hip stretch: 10 min"), mk(-7, "Legs", "strength", legs), mk(-6, "Easy run", "cardio", "Run: 20 min"),
    mk(-4, "Pull day", "strength", pull), mk(-3, "Stretch", "stretch", "Chest stretch: 5 min\nHip stretch: 10 min"), mk(-2, "Push day", "strength", push(60)),
    mk(-1, "Legs", "strength", legs),
    { ...mk(0, "Push day", "strength", push(62.5), false, "claude") },
    mk(0, "Hip and chest stretch", "stretch", "Chest stretch: 5 min\nHip flexor stretch: 5 min", false, "claude"),
    mk(1, "Easy run", "cardio", "Run: 25 min", false, "claude"), mk(2, "Pull day", "strength", pull, false, "claude"),
  ];
  let k = 0; for (const s of S.sessions) if (s.status === "done" && /run/i.test(s.title)) { const e = s.exercises[0], km = +(e.min / (6.1 - k * 0.08)).toFixed(1); e.stats = cleanRun({ distance_km: km, duration_min: e.min, avg_hr: 146 - (k % 2), max_hr: 158, cardio_load: Math.round(e.min * 1.4), zones: [3, e.min - 6, 3, 0, 0] }); k++; }
  const today = S.sessions.find(s => s.day === t && s.kind === "strength");
  today.exercises[0].sets[0].done = true; today.exercises[0].sets[1].done = true;
  S.profile = { goal: "build muscle", targets: { strength: 4, cardio: 2, stretch: 3 }, notes: "Push / pull / legs. Prefers training after 5pm.", timezone: prof().timezone, rhr_base: 50, hrv_base: 120 };
  S.daily = [[-4, 50, 121], [-3, 51, 118], [-2, 52, 112], [-1, 53, 108], [0, 55, 102]].map(([o, rhr, hrv]) => ({ day: addDays(t, o), rhr, hrv }));
  S.changes = [
    { id: 2, session_id: S.sessions.at(-1).id, action: "add", summary: "Planned “Pull day” for Sat", undone: false, created_at: new Date(Date.now() - 9e5).toISOString() },
    { id: 1, session_id: today.id, action: "update", summary: "Raised bench press to 62.5 kg on “Push day”", undone: false, created_at: new Date(Date.now() - 1e6).toISOString(), before: { ...today } },
  ];
  return {
    async load() {},
    async saveSession(s) { const row = { ...s, id: s.id || id(), source: s.source || "app", created_at: s.created_at || new Date().toISOString() }; upsertLocal(row); return row; },
    async deleteSession(i) { S.sessions = S.sessions.filter(s => s.id !== i); },
    async saveProfile(p) { S.profile = { ...p }; },
    async saveDaily(d) { S.daily = S.daily.filter(x => x.day !== d.day).concat({ ...d }); },
    async undo(c) { if (c.action === "add") S.sessions = S.sessions.filter(s => s.id !== c.session_id); else if (c.before) upsertLocal(c.before); c.undone = true; },
    async makeConnector() { S.connector = true; return "https://your-project.supabase.co/functions/v1/workout-mcp/" + randomToken(); },
    async dropConnector() { S.connector = false; },
  };
}

/* ---------- views ---------- */
function render() {
  const titles = { today: [dayLabel(todayISO(), { weekday: "long" }), dayLabel(todayISO(), { month: "long", day: "numeric" }) + (streak() > 1 ? " · " + streak() + "-day streak" : "")], log: [relDay(S.day), dayLabel(S.day, { month: "long", day: "numeric" })], progress: ["Activity", S.actView === "feed" ? "Your finished workouts" : "Recovery, records and trends"], claude: ["Claude", "Plan your training by chatting"] };
  const [h, p] = titles[S.tab];
  document.getElementById("pageTitle").textContent = h;
  document.getElementById("pageSub").textContent = p;
  document.getElementById("syncPill").textContent = S.mode === "preview" ? "Preview" : S.mode === "loading" ? "Loading" : S.stale ? "Offline" : "";
  for (const id of ["prevDay", "nextDay"]) document.getElementById(id).hidden = S.tab !== "log";
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const v = document.getElementById("view");
  v.innerHTML = S.mode === "loading" ? `<div class="tile"><p class="empty">Loading your workouts…</p></div>` : { today: viewToday, log: viewLog, progress: viewProgress, claude: viewClaude }[S.tab]();
  drawRest();
}

// The first unfinished set of today's first unfinished workout.
function current() {

  else { e.done = !e.done; if (holdOn(s, ei)) S.hold = null; }
  copy.status = copy.exercises.length && copy.exercises.every(exDone) ? "done" : copy.status === "done" ? "planned" : copy.status;
  upsertLocal(copy);
  if (copy.day === todayISO()) {   // session clock: starts with the first tick, stops when everything planned today is done
    if (!lsGet("wk-start-" + copy.day)) lsSet("wk-start-" + copy.day, Date.now());
    lsSet("wk-end-" + copy.day, todayList().every(x => x.status === "done") ? Date.now() : null);
  }
  if (si >= 0 && e.sets[si].done) {
    const nx = nextUp();
    if (copy.status !== "done") startRest(nx);
    else { stopRest(); if (nx) showAlert("Next up", nx); }
  }
  render();
  if (copy.status === "done" && s.status !== "done") toast("Workout done");
  try { await api.saveSession(copy); } catch (err) { upsertLocal(s); render(); toast("Couldn't save: " + err.message); }
}
// Change the weight or reps of one set to what you actually did.
async function editSet(id, ei, si, field, raw) {

  const copy = structuredClone(s), sets = copy.exercises[ei].sets, x = sets[si];
  if (field === "r") { const v = Math.round(+raw); if (raw === "" || !(v >= 0 && v <= 200)) return render(); if (x.t == null) x.t = x.r; x.r = v; }
  else { const v = raw === "" ? null : Math.round(+raw * 4) / 4; if (v !== null && !(v >= 0 && v <= 1000)) return render(); const old = x.w ?? null; x.w = v;
    for (let k = si + 1; k < sets.length; k++) if (!sets[k].done && (sets[k].w ?? null) === old) sets[k].w = v; }   // later sets follow the new weight
  upsertLocal(copy); if (!typing()) render();
  try { await api.saveSession(copy); } catch (err) { upsertLocal(s); render(); toast("Couldn't save: " + err.message); }
}
function typing() { return !!document.activeElement?.matches?.("#view input, #view select"); }

function nextUp() {

  const zone = /zone 2/i.test(cur.s.title + cur.e.name) ? " · zone 2, 140–155 bpm" : "";
  return `${cur.s.title === cur.e.name ? cur.e.name : cur.s.title + ": " + cur.e.name}${cur.e.min ? " · " + cur.e.min + " min" : ""}${zone}`;

async function disablePush() {
  const reg = await navigator.serviceWorker.getRegistration(), sub = await reg?.pushManager.getSubscription();
  if (sub) { await sb.from("wk_push").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
  S.pushOn = false;
}
async function schedulePush(msg, sec = REST_SEC) {
  if (S.mode !== "live" || !S.pushOn) return;
  try {
    const token = crypto.randomUUID();
    const { error } = await sb.from("wk_rest").upsert({ user_id: uid, token }); if (error) throw error;
    await sb.functions.invoke("workout-push", { body: { delay: Math.max(1, Math.round(sec)), token, title: "Rest's over", body: msg } });
  } catch (err) { console.warn("push schedule failed", err); }
}
async function cancelPush() { if (S.mode === "live" && S.pushOn) try { await sb.from("wk_rest").delete().eq("user_id", uid); } catch {} }

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act],[data-tab]"); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; if (S.tab === "log" && !S.logTouched) S.day = todayISO(); render(); window.scrollTo(0, 0); return; }
  const a = b.dataset.act, id = b.dataset.id;
  try {
    if (a === "tick") tick(id, +b.dataset.ei, +b.dataset.si);
    else if (a === "shiftday") { S.day = addDays(S.day, +b.dataset.n); S.logTouched = true; render(); }
    else if (a === "gotoday") { S.day = todayISO(); render(); }
    else if (a === "goday") { S.tab = "log"; S.day = id; S.logTouched = id !== todayISO(); render(); window.scrollTo(0, 0); }
    else if (a === "startworkout") { unlockAudio(); const t = todayISO(); if (!lsGet("wk-start-" + t) && todayList().some(x => x.status !== "done")) lsSet("wk-start-" + t, Date.now()); S.tab = "log"; S.day = t; S.logTouched = false; render(); window.scrollTo(0, 0); }
    else if (a === "restadj") { const left = Math.max(5, (S.restEnd - Date.now()) / 1000 + +b.dataset.n); startRest(S.restMsg, left); }
    else if (a === "actview") { S.actView = id; render(); }
    else if (a === "editdaily") { S.editDaily = true; render(); document.getElementById("dRhr")?.focus(); }
    else if (a === "hold") { startHold(id, +b.dataset.ei); render(); }
    else if (a === "holdoff") { S.hold = null; render(); }
    else if (a === "reston") { unlockAudio(); startRest(nextUp()); render(); }
    else if (a === "restoff") { stopRest(); render(); }
    else if (a === "closealert") document.getElementById("alertRoot").innerHTML = "";
    else if (a === "pushon") { unlockAudio(); await enablePush(); render(); toast("Rest alerts on"); }
    else if (a === "pushoff") { await disablePush(); render(); toast("Rest alerts off"); }
    else if (a === "pushtest") { unlockAudio(); startRest("This is a test. Lock your phone to see the notification."); S.restEnd = Date.now() + 10000; await cancelPush(); if (S.pushOn) { const token = crypto.randomUUID(); await sb.from("wk_rest").upsert({ user_id: uid, token }); await sb.functions.invoke("workout-push", { body: { delay: 10, token, title: "Rest's over", body: "Test alert. It works." } }); } render(); toast("Test alert in 10 seconds"); }
    else if (a === "add") openSheet({ type: "session", draft: { title: "", day: S.tab === "log" ? S.day : todayISO(), kind: "strength", status: "planned", lines: "", notes: "" } });
    else if (a === "edit") { const s = S.sessions.find(x => x.id === id); openSheet({ type: "session", orig: s, draft: { ...s, lines: toLines(s.exercises), run: s.exercises.find(x => x.stats)?.stats || {} } }); }
    else if (a === "close") { if (e.target === b || b.tagName === "BUTTON") closeSheet(); }
    else if (a === "setkind" || a === "setstatus") { readDraft(); S.sheet.draft[a === "setkind" ? "kind" : "status"] = id; drawSheet(); }
    else if (a === "delete") { if (!confirm("Delete this workout?")) return; await api.deleteSession(S.sheet.draft.id); closeSheet(); toast("Workout deleted"); }
    else if (a === "editprof") openSheet({ type: "profile", draft: structuredClone(prof()) });
    else if (a === "undo") { const c = S.changes.find(x => String(x.id) === id); await api.undo(c); render(); toast("Undone"); }
    else if (a === "mklink") { S.newUrl = await api.makeConnector(); render(); }
    else if (a === "copylink") { await navigator.clipboard.writeText(S.newUrl); toast("Link copied"); }
    else if (a === "droplink") { if (!confirm("Turn off the Claude connector? The link stops working.")) return; await api.dropConnector(); S.newUrl = null; render(); }
    else if (a === "signout") { await sb.auth.signOut(); location.reload(); }
  } catch (err) { toast("Couldn't save: " + (err.message || "try again")); }
});
document.addEventListener("change", e => {
  if (e.target.id === "prSel") { S.prEx = e.target.value; render(); }
  else if (e.target.dataset?.set) editSet(e.target.dataset.id, +e.target.dataset.ei, +e.target.dataset.si, e.target.dataset.set, e.target.value.trim());
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset?.set) e.target.blur(); });
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "sesForm") {
    readDraft(); const d = S.sheet.draft, err = document.getElementById("fErr");
    if (!d.title.trim()) { err.textContent = "Give the workout a name."; return; }
    if (!d.day) { err.textContent = "Pick a day."; return; }
    let ex = parseLines(d.lines, S.sheet.orig?.exercises || []);
    if (d.status === "done") ex = ex.map(x => ({ ...x, done: true, sets: x.sets.map(s => ({ ...s, done: true })) }));
    if (d.runShown) {
      const st = cleanRun(d.run);
      if (st) { let i = ex.findIndex(x => x.type !== "strength"); if (i < 0) { ex.push({ name: "Run", muscle: null, type: "cardio", sets: [], min: null, done: false }); i = ex.length - 1; }
        ex[i] = { ...ex[i], stats: st, done: true, min: st.duration_min ? Math.round(st.duration_min) : ex[i].min }; }
      else ex = ex.map(x => { const { stats, ...rest } = x; return rest; });
      if (ex.length && ex.every(exDone)) d.status = "done";
    }
    try { await api.saveSession({ id: d.id, day: d.day, title: d.title.trim(), kind: d.kind, status: d.status, exercises: ex, notes: d.notes.trim(), source: d.source, created_at: d.created_at }); S.day = d.day; closeSheet(); toast("Saved"); }
    catch (x) { err.textContent = "Couldn't save: " + x.message; }
  } else if (e.target.id === "profForm") {
    const bn = (id, lo, hi) => { const v = Math.round(+document.getElementById(id).value); return v >= lo && v <= hi ? v : null; };
    const p = { ...prof(), rhr_base: bn("pRhr", 25, 120), hrv_base: bn("pHrv", 5, 300), goal: document.getElementById("pGoal").value.trim() || "general fitness", notes: document.getElementById("pNotes").value.trim(), targets: Object.fromEntries(KINDS.map(k => [k, Math.max(0, Math.min(14, +document.getElementById("pT_" + k).value || 0))])) };
    try { await api.saveProfile(p); closeSheet(); toast("Saved"); } catch (x) { toast("Couldn't save: " + x.message); }
  } else if (e.target.id === "dailyForm") {
    const n = (id, lo, hi) => { const raw = document.getElementById(id).value.trim(); if (!raw) return null; const v = Math.round(+raw); return v >= lo && v <= hi ? v : NaN; };
    const rhr = n("dRhr", 25, 150), hrv = n("dHrv", 5, 300);
    if (Number.isNaN(rhr) || Number.isNaN(hrv) || (rhr === null && hrv === null)) return toast("Enter your resting HR, your HRV, or both");
    try { await api.saveDaily({ day: todayISO(), rhr, hrv }); S.editDaily = false; render(); toast("Saved"); } catch (x) { toast("Couldn't save: " + x.message); }
  } else if (e.target.id === "authForm") signIn(e.target);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });

/* ---------- sign-in (same account as Plan and Pocket) ---------- */
function showAuth(msg = "") {
  document.getElementById("authRoot").innerHTML = `<div class="auth"><form class="auth-card" id="authForm"><img src="icon.svg" width="64" height="64" alt="" style="border-radius:15px"><h2>Sign in to Workout</h2>
    <p>Same account as Plan and Pocket.</p><input class="field" id="authEmail" type="email" autocomplete="username" placeholder="you@example.com" required>
    <input class="field" id="authPass" type="password" autocomplete="current-password" placeholder="Password" required><div class="err">${esc(msg)}</div>
    <button class="btn primary" type="submit">Sign in</button><button class="link" type="button" onclick="document.getElementById('authRoot').innerHTML='';startPreview()">Just look around</button></form></div>`;
}
async function signIn(f) {
  f.querySelector('button[type="submit"]').disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById("authEmail").value.trim(), password: document.getElementById("authPass").value });
  if (error) return showAuth(error.message);
  document.getElementById("authRoot").innerHTML = ""; startLive(data.user);
}

/* ---------- start-up ---------- */
let reloadTimer = null;
function scheduleReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(async () => { try { await api.load(); S.stale = false; } catch { S.stale = true; } if (!S.sheet && !typing()) render(); }, 250); }
async function startLive(user) {
  uid = user.id; api = liveApi(); S.mode = "loading"; render();
  try { await api.load(); S.mode = "live"; }
  catch (err) { S.mode = "live"; S.stale = true; render(); toast(/relation|does not exist|schema cache/i.test(err.message || "") ? "Run setup.sql in Supabase first" : "Couldn't load: " + err.message); return; }
  render();
  sb.channel("wk-" + uid)
    .on("postgres_changes", { event: "*", schema: "public", table: "wk_sessions", filter: `user_id=eq.${uid}` }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "wk_changes", filter: `user_id=eq.${uid}` }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "wk_daily", filter: `user_id=eq.${uid}` }, scheduleReload)
    .subscribe();
}
function startPreview() { api = previewApi(); S.mode = "preview"; render(); }
// Tick the rest, hold and session timers without redrawing the whole page.
function setText(kind, text) { document.querySelectorAll(`[data-${kind}text]`).forEach(el => el.textContent = text); }
setInterval(() => {
  if (S.restEnd) {
    const left = (S.restEnd - Date.now()) / 1000;
    if (left <= 0) { S.restEnd = 0; beep(); showAlert("Rest's over", S.restMsg || nextUp()); drawRest(); }
    else setText("rest", mmss(left));
  }
  if (S.hold) {
    const left = (S.hold.end - Date.now()) / 1000;
    if (left <= 0) { const h = S.hold; S.hold = null; beep(); showAlert("Time's up", h.name); const e = S.sessions.find(x => x.id === h.id)?.exercises[h.ei]; if (e && !e.done) tick(h.id, h.ei, -1); else if (!S.sheet) render(); }
    else setText("hold", mmss(left));
  }
  const el = document.querySelector("[data-elapsed]"); if (el) { const v = elapsed(S.day); if (v !== null) el.textContent = clockHMS(v); }
}, 500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.mode === "live") scheduleReload(); });

(async function init() {
  render();
  const cfg = window.WK_CONFIG || {};
  if (new URLSearchParams(location.search).has("preview") || !cfg.supabaseUrl || !window.supabase) return startPreview();
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  if (pushSupported()) { navigator.serviceWorker.register("sw.js").catch(() => {}); await checkPush(); }
  if (data.session) startLive(data.session.user); else { startPreview(); showAuth(); }
})();
</script>
